<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashReader - Identifikasi Mata Uang</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056e0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="debug-log" style="position:fixed; bottom:0; width:100%; height:150px; background:black; color:lime; font-size:10px; overflow-y:scroll; z-index:9999; text-align: left; padding: 5px;"></div>
    <div class="app-container">
        <header class="app-header" id="main-header" style="display: none;">
            <button class="header-btn" id="btn-header-back" aria-label="Kembali">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="header-title" id="header-text">CashReader</div>
        </header>

        <main class="app-view active" id="view-splash">
            <div class="splash-core">
                <div class="logo-box">
                    <div class="logo-circle">
                        <svg width="32" height="32" fill="#ffffff" viewBox="0 0 24 24">
                            <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                        </svg>
                    </div>
                </div>
                <h1 class="splash-title">CashReader</h1>
                <p class="splash-desc">Platform Deteksi Nominal Uang Rupiah.</p>
            </div>
            <div class="splash-footer">
                <div class="dots-loader">
                    <div class="dot active"></div>
                    <div class="dot active" style="animation-delay: 0.2s"></div>
                    <div class="dot active" style="animation-delay: 0.4s"></div>
                </div>
                <span class="splash-action-text">Memulai Pemindai</span>
            </div>
        </main>

        <main class="app-view" id="view-menu">
            <button class="main-btn-circle" id="btn-mulai-deteksi">
                <div class="btn-content">
                    <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                    <span>MULAI DETEKSI</span>
                </div>
            </button>

            <button class="btn-exit" id="btn-global-keluar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Keluar Aplikasi</span>
            </button>

            <div class="footer-version">
                v1.2 BY AFOTECH
            </div>
        </main>

        <main class="app-view" id="view-camera">
            <div class="camera-window-wrapper">
                <div class="camera-viewport">
                    <video id="camera-stream" autoplay playsinline></video>
                    <div class="camera-overlay-icon" id="camera-icon-overlay">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="12" r="4"></circle></svg>
                    </div>
                </div>
                <div class="result-banner" id="prediction-result">Mencari Objek...</div>
            </div>
            <button class="action-button" id="btn-camera-back">Kembali</button>
        </main>
    </div>

    <canvas id="capture-canvas" class="hidden-canvas"></canvas>

    <script>
      window.onerror = function(msg, url, line) {
        var log = document.getElementById('debug-log');
        log.innerHTML += "Error: " + msg + " di baris " + line + "<br>";
        console.error("Error: " + msg + " di baris " + line);
        return false;
      };
    </script>
    <script src="app.js"></script>
</body>
</html>
